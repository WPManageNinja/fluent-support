name: fluent-support-test-lab

# The ONLY WordPress this suite ever touches. Disposable by construction:
# test-named DB, non-default table prefix (fstest_), loopback-only HTTP,
# plugin checkouts mounted read-only. MariaDB runs with production-default
# strict modes PLUS ONLY_FULL_GROUP_BY so bugs that hide on lenient dev
# stacks fail here.

services:
  db:
    image: ${FS_LAB_DB_IMAGE:-mariadb:11.4}
    command:
      - --sql-mode=ONLY_FULL_GROUP_BY,STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
    environment:
      MARIADB_DATABASE: ${FS_LAB_DB_NAME:-fluent_support_test}
      MARIADB_USER: ${FS_LAB_DB_USER:-fs_lab}
      MARIADB_PASSWORD: ${FS_LAB_DB_PASSWORD:-fs_lab_only}
      MARIADB_ROOT_PASSWORD: ${FS_LAB_DB_ROOT_PASSWORD:-fs_root_lab_only}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: "no"
    volumes:
      - db_data:/var/lib/mysql
      - ./init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro

  wordpress:
    image: ${FS_LAB_WORDPRESS_IMAGE:-wordpress:php8.2-apache}
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${FS_LAB_DB_NAME:-fluent_support_test}
      WORDPRESS_DB_USER: ${FS_LAB_DB_USER:-fs_lab}
      WORDPRESS_DB_PASSWORD: ${FS_LAB_DB_PASSWORD:-fs_lab_only}
      WORDPRESS_TABLE_PREFIX: fstest_
      WORDPRESS_DEBUG: "1"
      FS_LAB_PUBLIC_PORT: ${FS_LAB_HTTP_PORT:-8901}
      WORDPRESS_CONFIG_EXTRA: |
        $$fsLabPort = getenv('FS_LAB_PUBLIC_PORT') ?: '8901';
        $$fsLabHost = isset($$_SERVER['HTTP_HOST']) ? $$_SERVER['HTTP_HOST'] : '';
        $$fsLabAllowedHosts = array(
            '127.0.0.1:' . $$fsLabPort,
            'localhost:' . $$fsLabPort,
            'host.docker.internal:' . $$fsLabPort
        );
        if (!in_array($$fsLabHost, $$fsLabAllowedHosts, true)) {
            $$fsLabHost = '127.0.0.1:' . $$fsLabPort;
        }
        define('WP_HOME', 'http://' . $$fsLabHost);
        define('WP_SITEURL', 'http://' . $$fsLabHost);
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('DISALLOW_FILE_EDIT', true);
        define('AUTOMATIC_UPDATER_DISABLED', true);
    healthcheck:
      test:
        [
          "CMD",
          "php",
          "-r",
          "$$socket = @fsockopen('127.0.0.1', 80); if (!$$socket) { exit(1); } fclose($$socket);",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
    ports:
      - "127.0.0.1:${FS_LAB_HTTP_PORT:-8901}:80"
    restart: "no"
    volumes:
      - wordpress_data:/var/www/html
      - ../../:/var/www/html/wp-content/plugins/fluent-support:ro
      - ../../../fluent-support-pro:/var/www/html/wp-content/plugins/fluent-support-pro:ro

  wpcli:
    image: ${FS_LAB_WPCLI_IMAGE:-wordpress:cli-php8.2}
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${FS_LAB_DB_NAME:-fluent_support_test}
      WORDPRESS_DB_USER: ${FS_LAB_DB_USER:-fs_lab}
      WORDPRESS_DB_PASSWORD: ${FS_LAB_DB_PASSWORD:-fs_lab_only}
      WORDPRESS_TABLE_PREFIX: fstest_
      FS_STRICT_SQL: ${FS_STRICT_SQL:-0}
    profiles: ["tools"]
    user: "33:33"
    volumes:
      - wordpress_data:/var/www/html
      - ../../:/var/www/html/wp-content/plugins/fluent-support:ro
      - ../../../fluent-support-pro:/var/www/html/wp-content/plugins/fluent-support-pro:ro
    working_dir: /var/www/html

volumes:
  db_data:
  wordpress_data:
